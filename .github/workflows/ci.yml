name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    name: Attribution and secrets
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the commit range needs full history

      - name: Resolve commit range
        id: range
        env:
          # Through env, never interpolated into the script, so event data is not executed.
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          echo "base=${base:-0000000000000000000000000000000000000000}" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: No AI attribution in commit messages
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: bash scripts/check-no-ai-attribution.sh --range "$BASE" "$HEAD"

      - name: No secrets or agent files in added lines
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: bash scripts/check-secrets.sh --range "$BASE" "$HEAD"

      - name: Gitleaks over the full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  api:
    name: API (Go)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pisondev
          POSTGRES_PASSWORD: pisondev
          POSTGRES_DB: pisondev_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pisondev" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://pisondev:pisondev@localhost:5432/pisondev_test?sslmode=disable
      - run: go build -o /dev/null ./cmd/api

  web:
    name: Web (Next.js)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/assistant-web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/assistant-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  deploy:
    name: Deploy to the VPS
    needs: [guards, api, web]
    # What reaches main goes live; pull requests are checked, not deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    # One deploy at a time; a newer push waits for the one before it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/assistant-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/assistant-web

      - name: Build the release
        run: bash deploy/build-release.sh "$GITHUB_SHA"

      # The key may run bin/receive on the server and nothing else (docs/deployment.md).
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Deploy
        run: ssh vps < dist/release.tar.gz

      - name: Check the public site
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          host=${PUBLIC_ORIGIN#https://}
          if ! getent hosts "$host" >/dev/null; then
            echo "::warning::$host does not resolve yet; the server already confirmed the new version locally."
            exit 0
          fi
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$PUBLIC_ORIGIN/api/v1/health" | tee /dev/stderr | grep -q "\"version\":\"$GITHUB_SHA\""
