# Local development services. Production runs on the VPS, see docs/deployment.md.
name: pisondev-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pisondev
      POSTGRES_PASSWORD: pisondev # local only, never exposed beyond localhost
      POSTGRES_DB: pisondev
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5448:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/api/scripts/dev-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pisondev -d pisondev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
